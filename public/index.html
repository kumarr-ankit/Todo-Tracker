<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  
    #parent {
        width: 400px;
        height: 400px;
        background: #eeff00;
         display: flex;
         flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    #child {
        width: 200px;
        height: 200px;
        background: #00fd22;
         flex-direction: column;
         display: flex;
        justify-content: center;
        align-items: center;
    }

    #innerChild {
        width: 100px;
        height: 100px;
         flex-direction: column;
        background: #ff6708;
         display: flex;
        justify-content: center;
        align-items: center;
    }
</style>

<body>
    <div id="parent">Parent
        <div id="child">
            Child
            <div id="innerChild">
                Inner Child
            </div>
        </div>
    </div>

    <script>
parent.addEventListener('click',()=>{
    console.log('Parent is clicked');
},true)

child.addEventListener('click',()=>{
    console.log('Child is clicked');
},true)
innerChild.addEventListener('click',()=>{
    console.log('InnerChild is clicked');
},true) //second argment capture phase , default = false

    </script>
</body>

</html>
